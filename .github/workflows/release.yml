name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要重新构建并上传的已有 tag（例如 v0.1）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-exe:
    name: Build DouyinClean.exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Resolve tag
        id: tag
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT -eq "workflow_dispatch") { $env:INPUT_TAG } else { $env:REF_NAME }
          if (-not $tag) { throw "tag 不能为空" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "target tag: $tag"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Fallback build config for older tags
        if: ${{ hashFiles('DouyinClean.spec') == '' }}
        shell: pwsh
        run: |
          git fetch --depth=1 origin "+refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/origin/build-config"
          git checkout refs/remotes/origin/build-config -- DouyinClean.spec requirements-dev.txt

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q main.py gui.py browser.py blocker.py config.py logger.py matcher.py

      - name: Build onefile exe
        run: python -m PyInstaller --noconfirm --clean DouyinClean.spec

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/DouyinClean.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DouyinClean.exe" | Out-File -Encoding ascii dist/DouyinClean.exe.sha256
          Get-Item dist/DouyinClean.exe | Select-Object Name, Length

      - name: Upload assets to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          $exists = $true
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) { $exists = $false }
          if (-not $exists) {
            if ($env:EVENT -eq "push") {
              gh release create $env:TAG --repo $env:GITHUB_REPOSITORY --title "DouyinClean $env:TAG" --generate-notes
            } else {
              gh release create $env:TAG --repo $env:GITHUB_REPOSITORY --title "DouyinClean $env:TAG"
            }
          }
          gh release upload $env:TAG dist/DouyinClean.exe dist/DouyinClean.exe.sha256 --repo $env:GITHUB_REPOSITORY --clobber
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
